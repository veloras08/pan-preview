<title>资源分享盘交互原型 v2</title>
<style>
/* Layout: two columns on desktop (demo controls + phone), stacked on narrow screens.
   Tokens are defined once for a light, neutral, cool-grey look. */
:root{
  --bg:#e9ecf2; --panel:#ffffff; --screen:#f6f7f9; --ink:#14161b; --muted:#6a7180; --line:#e2e5eb;
  --chip:#eef1f5; --accent:#2350d1; --accent-ink:#ffffff; --accent-soft:#e4ebff;
  --danger:#c42e24; --ok:#17704f; --ok-soft:#e3f4ec; --warn:#a4560b; --warn-soft:#fbf0e2;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 10px 28px rgba(16,24,40,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
button,select,input{font:inherit;color:inherit}
.wrap{display:flex;gap:28px;align-items:flex-start;justify-content:center;padding:28px 16px;min-height:100%}
.panel{width:280px;flex:0 0 280px;background:var(--panel);border-radius:16px;padding:18px;box-shadow:var(--shadow);position:sticky;top:28px}
.panel h1{font-size:16px;margin:0 0 4px}
.panel .intro{color:var(--muted);font-size:12px;margin:0 0 16px}
.field{margin-bottom:16px}
.field>label,.field>.lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;min-width:0;border:0;background:transparent;padding:7px 6px;border-radius:8px;color:var(--muted);cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
select{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:#fff}
.guide{border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.guide h2{font-size:13px;margin:0 0 8px}
.guide ol{margin:0;padding-left:18px;color:var(--muted);font-size:12px}
.guide li{margin-bottom:8px}
.note{font-size:12px;color:var(--muted);margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}

.phone{position:relative;width:390px;max-width:100%;height:800px;max-height:calc(100dvh - 56px);background:var(--screen);border-radius:40px;overflow:hidden;box-shadow:0 0 0 10px #1b1d23,var(--shadow);flex:0 0 auto}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--screen)}
.topbar{display:flex;align-items:center;gap:6px;padding:16px 14px 8px;min-height:60px}
.title{flex:1;min-width:0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{flex:1;min-height:0;overflow:auto;padding:4px 16px 124px}
.iconbtn{width:36px;height:36px;border:0;border-radius:50%;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:var(--ink);flex:0 0 36px}
.iconbtn:hover{background:var(--chip)}
.tabbar{position:absolute;left:16px;right:16px;bottom:14px;display:flex;gap:4px;background:#fff;border-radius:999px;box-shadow:0 0 0 1px #ececef,var(--shadow);padding:6px}
.tabbar button{flex:1;position:relative;border:0;background:none;border-radius:999px;height:52px;display:grid;place-items:center;color:#3a3e46;cursor:pointer;transition:flex .2s}
.tabbar button[aria-current="page"]{background:#ebecef;color:#000;flex:1.8}
.dot{position:absolute;top:11px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--danger);border:2px solid #fff;box-sizing:content-box}
.tabbar button[aria-current="page"] .dot{border-color:#ebecef}
.bottombar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;background:#fff;border-radius:18px;box-shadow:var(--shadow);padding:10px}
.scrim{position:absolute;inset:0;background:rgba(14,16,22,.42);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.scrim.center{align-items:center;padding:24px}
.sheet{width:100%;background:#fff;border-radius:22px 22px 0 0;padding:20px 18px 22px}
.dialog{width:100%;background:#fff;border-radius:18px;padding:20px}
.toast{position:absolute;left:24px;right:24px;bottom:100px;background:#14161b;color:#fff;border-radius:12px;padding:10px 14px;font-size:13px;text-align:center;z-index:30}

.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(16,24,40,.05);margin-bottom:12px}
.card.tap{cursor:pointer}
.sect{margin:14px 0 8px}
.rowhead{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.h{font-size:15px;font-weight:700}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.thumb{width:44px;height:44px;border-radius:12px;flex:0 0 44px;display:grid;place-items:center;font-size:11px;color:#fff;font-weight:600}
.meta{flex:1;min-width:0}
.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub.wrap2{white-space:normal}
.logsub{font-size:13px;color:#8a8f99;margin:12px 0 2px}
.logh{display:flex;align-items:center;gap:8px;margin:16px 0 8px;font-size:15px;cursor:pointer}
.logh .logd{font-weight:600;color:#222}.logh .logp{flex:0 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#444}
.logh .logc{flex:none;font-size:12px;line-height:20px;padding:0 8px;border-radius:999px;background:#e6e8ec;color:#6b7280}
.logsentinel{text-align:center;font-size:12px;color:#a3a8b2;padding:10px 0}
.logfold{margin-left:auto;font-size:13px;color:var(--accent);background:none;border:0;cursor:pointer}
.logmores{display:flex;justify-content:center;gap:16px}
.logmore{display:block;margin:2px auto 4px;padding:6px 14px;font-size:13px;color:var(--accent);background:none;border:0;cursor:pointer}
.updbar{display:flex;align-items:center;gap:8px;margin:12px 0 4px;padding:10px 12px;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.updbar b{font-weight:600}.updbar .updread{margin-left:auto;font-size:13px;color:var(--accent);background:none;border:0;cursor:pointer;font-weight:500}
.updcard{display:flex;align-items:center;gap:12px;padding:12px;margin-top:10px;border-radius:14px;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.05);cursor:pointer;position:relative}
.updcard .uico{position:relative;flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.updcard .udot{position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:#f03e3e;box-shadow:0 0 0 2px #fff}
.updcard .umeta{flex:1;min-width:0}.updcard .un{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.updcard .ut{font-size:12px;color:#a3a8b2;margin-top:3px}
.updcard .upill{flex:none;font-size:12px;line-height:22px;padding:0 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:500}
.updcard .uchev{flex:none;color:#c3c7cf;font-size:18px}
.fnew{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f03e3e;margin-left:6px;vertical-align:2px}
.chip{display:inline-block;font-size:11px;line-height:18px;padding:0 7px;border-radius:999px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:1px;white-space:nowrap}
.chip.new{background:var(--ok-soft);color:var(--ok)}
.chip.trial{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.udot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);flex:0 0 8px}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:600;cursor:pointer;background:var(--chip);color:var(--ink);flex:1;min-width:0;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.small{flex:0 0 auto;padding:6px 12px;font-size:12px;border-radius:999px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.iconbtn:focus-visible,.seg button:focus-visible,.tabbar button:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheetbtn{display:block;width:100%;text-align:left;border:0;background:transparent;padding:15px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
.sheetbtn:disabled{color:var(--muted);cursor:not-allowed}
.cover{height:124px;border-radius:16px;margin-bottom:12px;position:relative;overflow:hidden}
.cover span{position:absolute;left:14px;bottom:12px;color:#fff;font-size:20px;font-weight:700;text-shadow:0 1px 6px rgba(0,0,0,.25)}
.search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;margin-bottom:12px}
.bar{height:8px;background:var(--chip);border-radius:999px;overflow:hidden;margin:10px 0 6px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv span:last-child{text-align:right;color:var(--muted)}
.player{position:relative;height:200px;border-radius:16px;background:#101217;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:16px;margin-bottom:12px;overflow:hidden;text-align:center}
.player .sub{color:#c3c9d4}
.progress{width:100%;height:4px;background:#2c3039;border-radius:4px;overflow:hidden;margin-top:12px}
.progress>i{display:block;height:100%;background:#fff;border-radius:4px}
.locked{position:absolute;inset:0;background:rgba(10,12,16,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px;text-align:center}
.pages{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pg{aspect-ratio:3/4;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:6px}
.pg.lock{background:var(--chip);border-style:dashed}
.stat{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:0 0 48px}
.fchips{display:flex;gap:8px;margin-bottom:8px;overflow-x:auto}
.fchips button{border:0;background:var(--chip);color:var(--muted);font-size:14px;padding:7px 14px;border-radius:10px;white-space:nowrap;cursor:pointer}
.fchips button[aria-pressed="true"]{background:#111;color:#fff}
.tgroup{font-size:14px;font-weight:600;color:var(--muted);margin:14px 0 4px}
.okdot{display:inline-block;width:12px;height:12px;border-radius:50%;background:#bbb;margin-right:5px;vertical-align:-1px}
.tgl{width:52px;height:30px;border-radius:15px;background:#d4d4d8;position:relative;transition:.15s}.tgl i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}.tgl.on{background:#3a6df0}.tgl.on i{left:25px}
.grab{width:40px;height:4px;border-radius:2px;background:#d4d4d8;margin:-8px auto 10px}
.mname{font-size:13px;color:var(--muted);text-align:center;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi{display:flex;align-items:center;gap:18px;width:100%;border:0;background:none;padding:14px 8px;font-size:17px;cursor:pointer;text-align:left;color:#111}
.mi.danger{color:var(--danger)}.mhr{border:0;border-top:1px solid var(--line);margin:4px 0}
.dlginput{width:100%;box-sizing:border-box;border:1px solid #e3e3e6;background:#f6f6f7;border-radius:12px;padding:13px 14px;font-size:16px;margin:12px 0 16px}
.pick{position:absolute;inset:0;background:#fff;z-index:15;display:flex;flex-direction:column}
.phead{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 6px}
.ptitle{font-size:17px;font-weight:600}
.pcancel{border:0;background:#f4f4f5;border-radius:999px;padding:10px 18px;font-size:16px;cursor:pointer;box-shadow:var(--shadow)}
.ppath{padding:8px 20px 10px;font-size:14px;color:#8a8f99;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbody{flex:1;overflow:auto;padding:0 16px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.pcard{height:96px;border-radius:14px;background:#f3f3f4;display:grid;place-items:center;cursor:pointer}
.pname{font-size:15px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pdate{font-size:12px;color:#a0a4ac;margin-top:2px}
.pbar{display:flex;gap:12px;padding:12px 16px 22px}
.cslabel{font-size:17px;font-weight:600;margin:0 0 12px}
.csfield{position:relative;display:flex;align-items:center;background:#eef0f1;border-radius:14px;padding:0 16px;margin-bottom:28px;height:62px}
.csfield input,.csfield textarea{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:17px;outline:none;padding:0}
.csfield textarea{resize:none;padding:18px 0 34px}
.cscount{color:#8b9097;font-size:15px;margin-left:8px}
.csadd{width:130px;height:92px;border-radius:12px;background:#eef0f1;border:0;color:var(--accent);font-size:30px;display:grid;place-items:center;cursor:pointer;margin-bottom:6px}
.csx{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.cschg{position:absolute;bottom:6px;left:6px;border:0;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;font-size:12px;padding:3px 10px;cursor:pointer}
.pnew,.pgo{flex:1;border:0;border-radius:999px;padding:16px;font-size:17px;font-weight:600;cursor:pointer}
.pnew{background:#d9d9db;color:#111}.pgo{background:#4169f0;color:#fff}.pgo:disabled{background:#b9c6f5;cursor:not-allowed}
.empty{text-align:center;color:var(--muted);padding:32px 12px}
.fail{margin-top:20px;text-align:center}
.fail .name{font-size:16px;white-space:normal}
.ph{font-size:11px;color:var(--muted);margin-top:10px}


/* Home: calm white page, grey rounded cards, horizontal space strip */
.screen.home{background:#fff}
.screen.home .title{font-size:30px;letter-spacing:-.5px}
.avatarbtn{width:34px;height:34px;border-radius:50%;border:0;background:linear-gradient(135deg,#c9ced8,#8b93a3);color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 34px;margin-left:2px}

.hhead{display:flex;align-items:center;gap:6px;margin-bottom:14px}

A.doSaveFile = (sid, fid) => {
  const s = getSpace(sid), f = s.files.find(x => x.id === fid);
  if (S.mine.some(m => m.from === sid && m.srcId === fid)) return toast('这个文件已在「文件」中');
  if (f.size > freeMB()) return toast('存储容量不足，无法保存。清理后可以保存');
  S.mine.unshift(copyOf(f, s));
  toast('已保存到「文件」');
};
A.saveSpace = id => A.doSaveSpace(id);
A.doSaveSpace = id => {
  const s = getSpace(id);
  const list = s.files.filter(f => !f.pending);
  let saved = 0;
  list.forEach(f => {
    if (S.mine.some(m => m.from === s.id && m.srcId === f.id)) { saved++; return; }
    if (f.size > freeMB()) return;       // 容量不足时跳过这个文件，继续尝试后面的
    S.mine.unshift(copyOf(f, s));
    saved++;
  });
  toast(saved === list.length
    ? `已保存 ${list.length} 个文件到「来自 ${s.name}」`
    : `已保存 ${saved} / ${list.length}，存储容量不足，清理后可以保存全部`);
};

/* ---------- views ---------- */
function unreadSpaces(){ return S.spaces.filter(s => s.followed && s.shared && unreadN(s) > 0); }

function vHome(){
  const followed = S.spaces.filter(s => s.followed);
  const upd = followed.filter(x => x.shared);
  let h = '';
  if (followed.length){
    h += `<section class="hcard${S.showSpaces ? '' : ' collapsed'}"><div class="hhead"><span class="t">空间</span>
      <button aria-label="${S.showSpaces ? '隐藏空间' : '显示空间'}" aria-pressed="${S.showSpaces}" onclick="act('toggle','showSpaces')">${svg(S.showSpaces ? 'eye' : 'eyeOff', 20)}</button>
      <button aria-label="查看我关注的全部空间" onclick="act('goSpaces','follow')">${svg('chev', 20)}</button></div>`;
    if (S.showSpaces){
      h += upd.length
        ? upd.slice().sort((a, b) => a.ago - b.ago).slice(0, 3).map(s => `
          <div class="frow" role="button" tabindex="0" onclick="act('openFromHome','${s.id}')">
            <span class="sbox" style="background:${spBg(s, 135)};display:grid;place-items:center">${s.nocover ? folderIcon(30) : ''}</span>
            <div class="meta"><div class="fn">${esc(s.name)}</div><div class="fs">${unreadN(s) > 0 ? unreadN(s) + ' 个新文件 · ' : '更新于 '}${esc(s.updated)}</div></div>
            ${unreadN(s) > 0 ? '<i class="udot" aria-label="有更新"></i>' : ''}
          </div>`).join('')
        : `<div class="hempty">关注的空间暂时没有可看的内容</div>`;
    }
    h += `</section>`;
  }
  // 最近保存：只展示文件夹，按空间归并
  const seen = new Set(), saved = [];
  S.mine.forEach(f => { if (f.from && !f.savedHidden && !seen.has(f.from)){ seen.add(f.from); saved.push(f); } });
  h += `<section class="hcard${S.showSaved ? '' : ' collapsed'}"><div class="hhead"><span class="t">最近保存</span>
    <button aria-label="${S.showSaved ? '隐藏最近保存' : '显示最近保存'}" aria-pressed="${S.showSaved}" onclick="act('toggle','showSaved')">${svg(S.showSaved ? 'eye' : 'eyeOff', 20)}</button>
    <button aria-label="查看全部" onclick="act('savedAll')">${svg('chev', 20)}</button></div>`;
  if (S.showSaved){
    h += saved.length ? saved.slice(0, 3).map(f => {
      const sp = getSpace(f.from);
      return `<div class="frow" role="button" tabindex="0" onclick="act('savedAll')">${folderSvg()}
        <div class="meta"><div class="fn">${esc(sp.name)}</div>
          <div class="fs">${esc(f.savedAt || '')} · <span class="from" role="button" tabindex="0" onclick="event.stopPropagation();act('openSpace','${sp.id}')">来自：${esc(sp.name)}${svg('chev', 12)}</span></div></div>
      </div>`;
    }).join('') : `<div class="hempty">保存的空间会以文件夹形式出现在这里</div>`;
  }
  h += `</section>`;
  // 最近查看：按时间分组，大缩略图
  h += `<section class="hcard${S.showView ? '' : ' collapsed'}"><div class="hhead"><span class="t">最近查看</span>
    <button aria-label="${S.showView ? '隐藏最近查看' : '显示最近查看'}" aria-pressed="${S.showView}" onclick="act('toggle','showView')">${svg(S.showView ? 'eye' : 'eyeOff', 20)}</button>
    <button aria-label="查看全部" onclick="act('goFiles')">${svg('chev', 20)}</button></div>`;
  if (S.showView) h += viewList();
  h += `</section>`;
  return h;
}

function bigThumb(f){
  const bg = f.kind === 'image' ? 'linear-gradient(135deg,#b197fc,#74c0fc)' : f.kind === 'video' ? 'linear-gradient(135deg,#5c7cfa,#364fc7)' : KIND[f.kind].color;
  return `<span class="vbig" style="background:${bg}" role="button" tabindex="0" onclick="act('preview',null,'${f.id}','own')">${f.kind === 'video' ? '' : KIND[f.kind].label}${f.kind === 'video' ? `<span class="dur">${fmtDur(f.dur)}</span>${f.prog ? `<span class="pg"><i style="width:${f.prog * 100}%"></i></span>` : ''}` : ''}</span>`;
}
function viewList(){
  const list = S.mine.filter(f => f.vr).sort((a, b) => b.vr - a.vr);
  if (!list.length) return `<div class="hempty">查看过的文件会出现在这里</div>`;
  const groups = [];
  list.forEach(f => { const g = groups[groups.length - 1]; if (g && g.at === f.viewedAt) g.items.push(f); else groups.push({at:f.viewedAt, items:[f]}); });
  return groups.map(g => {
    let h = `<div class="vgl">${esc(g.at)}</div>`;
    if (g.items.length > 1 && g.items.every(f => f.kind === 'image')){
      return h + `<div class="vgrid">${g.items.map(bigThumb).join('')}</div>`;
    }
    return h + g.items.map(f => `<div class="frow" role="button" tabindex="0" onclick="act('preview',null,'${f.id}','own')">${bigThumb(f)}
      <div class="meta"><div class="fn">${esc(f.name)}</div>
      <div class="fs open" role="button" tabindex="0" onclick="event.stopPropagation();act('goFiles')">在文件夹中打开</div></div></div>`).join('');
  }).join('');
}

function vSaved(){
  const seen = new Set(), list = [];
  S.mine.forEach(f => { if (f.from && !f.savedHidden && !seen.has(f.from)){ seen.add(f.from); list.push(f); } });
  list.sort((a, b) => (b.savedAt || '').localeCompare(a.savedAt || ''));
  if (!list.length) return `<div class="empty">保存的空间会以文件夹形式出现在这里</div>`;
  const groups = {};
  list.forEach(f => (groups[f.savedAt] = groups[f.savedAt] || []).push(f));
  return Object.keys(groups).map(d => `<div class="sgd">${esc(d)}</div>` + groups[d].map(f => {
    const sp = getSpace(f.from);
    return `<div class="frow" role="button" tabindex="0" onclick="act('goFiles')">${folderSvg()}
      <div class="meta"><div class="fn">${esc(sp.name)}</div>
      <div class="fs"><span class="from" role="button" tabindex="0" onclick="event.stopPropagation();act('openSpace','${sp.id}')">来自：${esc(sp.name)}${svg('chev', 12)}</span></div></div></div>`;
  }).join('')).join('');
}

function vTransfer(){
  const tab = S.transferTab;
  const inTab = x => (x.type === '上传') === (tab === 'up');
  const base = S.transfers.filter(inTab);
  const cnt = k => base.filter(x => k === 'all' || x.status === k).length;
  const list = base.filter(x => S.transferSeg === 'all' || x.status === S.transferSeg);
  const chips = [['all','全部'],['run', tab === 'up' ? '上传中' : '下载中'],['done', tab === 'up' ? '已上传' : '已下载'],['fail','失败']];
  let h = `<div class="utabs" style="padding:0 0 0;border-bottom:1px solid var(--line);margin:0 -16px 12px;padding:0 16px">${[['down','下载'],['up','上传']].map(([k,l]) => `<button aria-pressed="${tab === k}" onclick="act('set','transferTab','${k}');act('set','transferSeg','all')">${l}</button>`).join('')}</div>`;
  h += `<div class="fchips">${chips.map(([k,l]) => `<button aria-pressed="${S.transferSeg === k}" onclick="act('set','transferSeg','${k}')">${l}${k !== 'fail' && cnt(k) ? ' ' + cnt(k) : ''}</button>`).join('')}</div>`;
  if (!list.length){ h += `<div class="empty" style="padding:80px 12px">${svg('transfer', 56)}<div style="margin-top:12px;color:var(--ink)">暂无任务</div></div>`; }
  else {
    const days = ['今天','昨天','7 天前'].filter(d => list.some(x => x.day === d));
    h += days.map(d => `<div class="tgroup">${d}</div>` + list.filter(x => x.day === d).map(x => {
      const st = x.status === 'fail' ? `<span style="color:var(--danger)">${esc(x.reason)}</span>` : x.status === 'run' ? `${x.pct}% · ${x.size}` : `<span class="okdot"></span>${x.size}`;
      return `<div class="row" style="cursor:default">${thumb(x.kind)}
        <div class="meta"><div class="name">${esc(x.name)}</div><div class="sub">${x.type === '保存' ? '保存 · ' : ''}${st}</div>
        ${x.status === 'run' ? `<div class="bar" style="margin:6px 0 0"><i style="width:${x.pct}%"></i></div>` : ''}</div>
        ${x.status === 'fail' ? `<button class="btn small" onclick="act('retryTransfer','${x.id}')">重试</button>` : ''}
        <button class="iconbtn" aria-label="更多" onclick="act('trMenu','${x.id}')" style="font-size:20px;color:var(--muted)">⋮</button></div>`;
    }).join('')).join('');
  }
  return h;
}

const SORTS = [['nameAZ','名称 (A-Z)'],['nameZA','名称 (Z-A)'],['sizeSmall','大小（从小到大）'],['sizeLarge','大小（从大到小）'],['dateOld','时间（最早）'],['dateNew','时间（最新）']];
function dkey(str){ const m = /(\d+)\/(\d+)(?: (\d+):(\d+))?/.exec(str || ''); return m ? (+m[1]) * 1e6 + (+m[2]) * 1e4 + (+(m[3] || 0)) * 100 + (+(m[4] || 0)) : 0; }

  const d = new Date(Date.UTC(2026, 9, 12, 20, 0, 0) - (((f.newly ? h % 2 : h % 20) * 86400) + (h % 43200)) * 1000);
  const p = n => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}-${p(d.getUTCMonth() + 1)}-${p(d.getUTCDate())} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`;
}
function hasNew(s, d, owner){ return newUnder(s, owner, d).length > 0; }
function dirTime(s, d, owner){ return underF(s, owner, d).map(fTime).sort().pop() || ''; }
function spCard(s, f, owner, guest){

function vSpace(s, t){

  }
  const it = spItems(s, t, owner);

    gs.forEach(g => {
      const cur = S.logOpen[g.key] || 4;
      const items = logItems(s, g, owner, guest);
      const shown = items.slice(0, cur), rest = items.length - shown.length;
      const lbl = g.path ? g.path.split('/').map(esc).join(' › ') : esc(s.name);

  h += all.length ? (S.spView === 'grid' ? `<div class="ggrid">${all.join('')}</div>` : all.join('')) : `<div class="empty">${S.spQ.trim() ? '没有找到匹配的文件' : '空间里还没有文件'}</div>`;
  return h;
}

function vPreview(top){

    player = `<div class="player" style="background:linear-gradient(135deg,#7048e8,#a78bfa)"><div style="font-size:14px">图片预览（示意）</div></div>`;
  } else {

  }
  const from = top.mode === 'own' ? (f.from ? '来自空间（副本）' : '个人文件') : sp.name;
  const copyNote = '';
  const body = `${player}
    <div class="card">
      <div class="name" style="margin-bottom:6px">${esc(f.name)}</div>
      <div class="kv"><span>类型</span><span>${KIND[f.kind].label}</span></div>

      <div class="kv"><span>来源</span><span>${esc(from)}</span></div>
      ${copyNote}
    </div>`;
  let bottom;
  if (top.mode === 'own'){
    bottom = `<div class="bottombar"><button class="btn" onclick="act('downloadOwn')">下载</button>${f.from
      ? `<button class="btn" disabled>分享</button>`
      : `<button class="btn primary" onclick="act('shareFile')">分享</button>`}</div>`;
  } else if (top.mode === 'owner'){
    bottom = `<div class="bottombar"><button class="btn" onclick="act('downloadOwn')">下载</button></div>`;
  } else {
    bottom = `<div class="bottombar"><button class="btn primary" onclick="act('saveFile','${sp.id}','${f.id}')">保存到我的文件</button></div>`;

  return {body, bottom};

    const ph = sv('<rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M4 18l5-4 4 3 3-2 4 3"/>');
    const vd = sv('<circle cx="12" cy="12" r="9"/><path d="M10 9l5 3-5 3z" fill="#fff"/>');
    const up = sv('<path d="M12 19V6M6 11l6-6 6 6"/>');
    const nf = sv('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v5M9.5 12.5h5"/>');
    return `<div class="name" style="text-align:center;font-size:17px;margin:2px 0 22px">添加到空间</div>
      <div class="addgrid">${it('照片', 'linear-gradient(180deg,#3aa6ff,#1a82f0)', ph, `act('spAddFile','${sh.id}','image')`)}${it('视频', 'linear-gradient(180deg,#4fd68b,#25b86a)', vd, `act('spAddFile','${sh.id}','video')`)}${it('文件', 'linear-gradient(180deg,#a3adc9,#7e8aae)', up, `act('spAddFile','${sh.id}','doc')`)}${it('新建文件夹', 'linear-gradient(180deg,#ffbf3c,#f59a1b)', nf, `act('spNewFolderStart','${sh.id}')`)}</div>
      <p class="sub" style="text-align:center;margin:18px 0 0;font-size:12px">添加到当前位置，无需审核，关注者立即可见</p>`;
  }
  if (sh.type === 'add'){
    const it = (label, bg, ico, act) => `<button class="addit" onclick="${act}"><span class="addic" style="background:${bg}">${ico}</span>${label}</button>`;
    const ph = '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="11" r="2"/><path d="M4 18l5-4 4 3 3-2 4 3"/></svg>';
    const vd = '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 9l5 3-5 3z" fill="#fff"/></svg>';
    const up = '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V6M6 11l6-6 6 6"/></svg>';
    const nf = '<svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 10v5M9.5 12.5h5"/></svg>';
    if (rootOf(hereLoc()) === 'saved') return `<div class="name" style="text-align:center;font-size:17px;margin:2px 0 22px">添加到文件</div>
      <div class="addgrid">${it('新建文件夹', 'linear-gradient(180deg,#ffbf3c,#f59a1b)', nf, "act('newFolderStart','here')")}</div>
      <p class="sub" style="text-align:center;margin:18px 0 0;font-size:12px">「我保存的」用于存放保存的内容，这里只能新建文件夹</p>`;
    return `<div class="name" style="text-align:center;font-size:17px;margin:2px 0 22px">添加到文件</div>
      <div class="addgrid">${it('照片', 'linear-gradient(180deg,#3aa6ff,#1a82f0)', ph, "act('addFile','image')")}${it('视频', 'linear-gradient(180deg,#4fd68b,#25b86a)', vd, "act('addFile','video')")}${it('文件', 'linear-gradient(180deg,#a3adc9,#7e8aae)', up, "act('addFile','doc')")}${it('新建文件夹', 'linear-gradient(180deg,#ffbf3c,#f59a1b)', nf, "act('newFolderStart','here')")}</div>
      <p class="sub" style="text-align:center;margin:18px 0 0;font-size:12px">添加的文件默认放在「我上传的」</p>`;
  }
  return '';
}

const MI = {
  share:'<circle cx="6" cy="12" r="2.6"/><circle cx="17" cy="5.5" r="2.6"/><circle cx="17" cy="18.5" r="2.6"/><path d="M8.3 10.8l6.4-3.9M8.3 13.2l6.4 3.9"/>',
  download:'<path d="M12 4v11M7 11l5 5 5-5M4 20h16"/>',
  rename:'<path d="M5 19l1-4L16.5 4.5a2 2 0 0 1 3 3L9 18z"/><path d="M4 21h8"/>',
  move:'<path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4H6.5A2.5 2.5 0 0 0 4 6.5v7A2.5 2.5 0 0 0 6.5 16H8"/>',
  trash:'<path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v5.5M14 11v5.5"/>',
  space:'<path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5L12 12l8-4.5M12 12v9"/>'
};
function itemMenu(k, id){
  const mi = (ic, label, a, danger) => `<button class="mi${danger ? ' danger' : ''}" onclick="${a}"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${MI[ic]}</svg>${label}</button>`;
  if (itemName(k, id) === undefined) return '';
  const key = `'${k}','${id}'`;
  return `<div class="grab"></div><div class="mname">${esc(itemName(k, id))}</div>`
    + mi('share', '分享', "act('shareFile')")
    + (k === 'group' ? mi('space', '查看来源空间', `act('openSpace','${id}')`) : '')
    + '<hr class="mhr">'
    + mi('download', '下载', k === 'file' ? "act('downloadOwn')" : `act('downloadItem',${key})`)
    + mi('rename', '重命名', `act('renameStart',${key})`)
    + mi('move', '移动', `act('pickStart','move',${key})`)
    + mi('copy', '复制', `act('pickStart','copy',${key})`)
    + '<hr class="mhr">'
    + mi('trash', '删除', `act('deleteItem',${key})`, true);
}
function pickerHtml(){
  const p = S.picker; if (!p) return '';
  const bad = new Set(); if (p.mode !== 'copy') p.items.forEach(i => { if (i.k === 'dir' || i.k === 'sys'){ bad.add(i.id); descDirs(i.id).forEach(x => bad.add(x)); } });
  const raw = p.at ? S.folders.filter(d => d.parent === p.at && !bad.has(d.id)).map(d => { const u = under(d.id); return {id:d.id, name:d.name, size:sumSize(u), n:u.length, at:lastAt(u) || d.at}; }).concat(sysAt(p.at).filter(k => !bad.has(k)).map(k => { const u = under(k); return {id:k, name:locName(k), size:sumSize(u), n:u.length, at:lastAt(u)}; }))
                       : sysAt('root').filter(k => !bad.has(k)).map(k => { const u = under(k); return {id:k, name:locName(k), size:sumSize(u), n:u.length, at:lastAt(u)}; })
                       .concat(sortEntries(S.folders.filter(d => d.parent === 'root' && !bad.has(d.id)).map(d => { const u = under(d.id); return {id:d.id, name:d.name, size:sumSize(u), n:u.length, at:lastAt(u) || d.at}; })));
  const gl = L => groupsAt(L).filter(g => !(p.mode !== 'copy' && p.items.some(i => i.k === 'group' && i.id === g))).map(g => { const u = under('g:' + g); return {id:'g:' + g, name:gName(g), size:sumSize(u), n:u.length, at:lastAt(u)}; });
  const list = p.at ? sortEntries(raw.concat(gl(p.at))) : raw.concat(sortEntries(gl('root')));
  const pfiles = S.mine.filter(f => fileLoc(f) === (p.at || 'root')).sort((x, y) => x.name.localeCompare(y.name, 'zh'));
  const cur = SORTS.find(x => x[0] === S.sortBy)[1];
  const verb = p.mode === 'copy' ? '复制' : '移动';
  return `<div class="pick"><div class="phead">${p.at ? `<button class="iconbtn" aria-label="上一级" onclick="act('pkUp')">‹</button>` : '<span style="width:40px"></span>'}
      <div class="ptitle">选择目标文件夹</div><button class="pcancel" onclick="act('pkCancel')">取消</button></div>
    <div class="pbody"><div class="sortbar" style="margin:0 0 10px"><button onclick="act('sortSheet')">${esc(cur)} ⌄</button>
      <button class="iconbtn sm" aria-label="切换视图" onclick="act('set','fileView','${S.fileView === 'grid' ? 'list' : 'grid'}')">${svg(S.fileView === 'grid' ? 'list' : 'grid', 22)}</button></div>
    ${(list.length || pfiles.length) ? (S.fileView === 'grid'
      ? `<div class="pgrid">${list.map(d => `<div class="pitem" role="button" tabindex="0" onclick="act('pkEnter','${d.id}')"><div class="pcard">${folderIcon(84)}</div><div class="pname">${esc(d.name)}</div><div class="pdate">${fdate(d.at)}</div></div>`).join('')}${pfiles.map(f => `<div class="pitem" style="opacity:.55;cursor:default"><div class="pcard" style="cursor:default">${thumb(f.kind)}</div><div class="pname">${esc(f.name)}</div><div class="pdate">${fdate(fAt(f))}</div></div>`).join('')}</div>`
      : list.map(d => `<div class="frow" role="button" tabindex="0" onclick="act('pkEnter','${d.id}')">${folderSvg()}<div class="meta"><div class="fn">${esc(d.name)}</div><div class="fs">${fdate(d.at)}${d.n ? ' · ' + d.n + ' 个文件' : ''}</div></div></div>`).join('') + pfiles.map(f => `<div class="frow" style="opacity:.55;cursor:default">${thumb(f.kind)}<div class="meta"><div class="fn">${esc(f.name)}</div><div class="fs">${fdate(fAt(f))}</div></div></div>`).join(''))
      : `<div class="empty">这里还没有内容，可点下方「新建文件夹」</div>`}</div>
    <div class="pbar"><button class="pnew" onclick="act('newFolderStart','picker')">新建文件夹</button><button class="pgo" onclick="act('pkConfirm')">${verb}</button></div></div>`;
}
function overlays(){
  let o = pickerHtml() + csHtml();
  if (S.sheet){
    o += `<div class="scrim" onclick="act('closeSheet')"><div class="sheet" onclick="event.stopPropagation()">${sheetHtml(S.sheet)}</div></div>`;
  }
  if (S.dialog){
    const d = S.dialog;
    o += `<div class="scrim center" onclick="act('closeDialog')"><div class="dialog" onclick="event.stopPropagation()">
      <div class="name" style="font-size:16px;white-space:normal">${esc(d.title)}</div>
      ${d.input != null ? `<input id="dlgIn" class="dlginput" maxlength="${d.input2 != null ? 30 : 60}" placeholder="${esc(d.ph || '')}" value="${esc(d.input)}" onkeydown="if(event.key==='Enter')act('confirm')">${d.input2 != null ? `<textarea id="dlgIn2" class="dlginput" maxlength="200" rows="3" placeholder="${esc(d.ph2 || '')}" style="margin-top:8px;resize:none;font:inherit">${esc(d.input2)}</textarea>` : ''}` : `<p class="sub wrap2" style="margin:8px 0 16px;font-size:13px">${esc(d.body)}</p>`}
      <div style="display:flex;gap:8px">${d.name ? '<button class="btn" onclick="act(\'closeDialog\')">取消</button>' : ''}
        <button class="btn ${d.danger ? 'danger' : 'primary'}" onclick="act('${d.name ? 'confirm' : 'closeDialog'}')">${esc(d.ok)}</button></div>
    </div></div>`;
  }
  return o;
}

/* ---------- demo panel ---------- */
function panel(){
  return `<h1>交互原型 · 演示控制</h1>
    <p class="intro"><b>v2</b> · 2026-10-17 · 对齐 PRD v9 / 交互逻辑说明 v2。暂不含会员逻辑：空间内容可完整查看，保存只校验存储容量。含会员逻辑的旧版见 <a href="https://veloras08.github.io/pan-preview/prototype/" target="_blank" rel="noopener">v1</a>。</p>
    <div class="field"><button class="btn" style="width:100%" onclick="act('reset')">重置演示</button></div>
    <div class="guide"><h2>建议体验路径</h2>
      <ol>
        <li>进入「空间」→「剪辑素材库」，点「转场合集.mp4」完整播放，再点「保存到我的文件」直接保存。</li>
        <li>点「保存全部文件」保存整个空间，剩余容量不够时会部分保存并提示。</li>
        <li>在「空间」点「+」创建空间：只填名称就能创建；不填简介时卡片和详情不显示简介，不选背景图时显示灰底 + 文件夹图标。</li>
        <li>在自己的空间里点「⋯」→「编辑信息」，补充、修改或移除简介和背景图。</li>
        <li>打开「模板合集」，它已停止分享，关注者看到失效页，无法浏览。</li>
        <li>在「我的」→「我的分享」里停止或重新分享「我的课程资料」。</li>
        <li>在「文件」里删除一个文件，观察确认文案和「不进回收站」的说明。</li>
        <li>在「我的课程资料」里点右下角「+」，选择照片、视频、文件或新建文件夹（和「文件」页一致）；上传无需审核，关注者立即可见，并出现在「更新」里。</li>
      </ol>
      <div class="note">占位内容：举报、删除空间的后果文案、失效页文案、设置子页，均为待设计项，原型中只做提示。会员相关（开通、试看、扩容）待产品功能稳定后再加回。</div>
    </div>`;
}

/* ---------- render ---------- */
function render(){
  const t = curTop();
  let title = '', right = '', body = '', bottom = '';
  if (!t){
    title = {home:'最近', files:'文件', spaces:'空间', mine:''}[S.tab];
    if (S.tab === 'home'){
      const running = S.transfers.filter(x => x.status === 'run').length;
      right = `<button class="iconbtn" aria-label="搜索" onclick="act('goSearch')">${svg('search', 24)}</button><button class="iconbtn rel" aria-label="传输" onclick="act('transfer')">${svg('transfer', 24)}${running ? `<span class="tbadge">${running}</span>` : ''}</button>`;
      body = vHome();
    }
    else if (S.tab === 'files'){
      right = `<div class="pill"><button class="iconbtn" aria-label="搜索" onclick="act('goSearch')">${svg('search', 22)}</button><button class="iconbtn" aria-label="更多" onclick="act('filesMenu')">⋮</button></div>`;
      body = vFiles();
      bottom = `<button class="fab" aria-label="添加" onclick="act('addSheet')">+</button>`;
    }
    else if (S.tab === 'spaces'){ right = `<button class="iconbtn" aria-label="创建空间" onclick="act('createSpace')">+</button>`; body = vSpaces(); }
    else body = vMine();
  } else if (t.v === 'space'){
    const s = getSpace(t.id);
    const isDir = !!(t.dir && !t.log);
    title = isDir ? t.dir.split('/').pop() : '';
    right = isDir ? `<div class="pill"><button class="iconbtn" aria-label="搜索" onclick="act('spSearchOn')">${svg('search', 22)}</button></div>` : `<button class="iconbtn" aria-label="搜索" onclick="act('spSearchOn')">${svg('search', 22)}</button><button class="iconbtn" aria-label="更多" onclick="act('spaceMenu','${s.id}')">⋯</button>`;
    body = vSpace(s, t);
    bottom = spaceBottom(s);
  } else if (t.v === 'preview'){
    title = '预览';
    const p = vPreview(t);
    body = p.body; bottom = p.bottom;
  } else if (t.v === 'folder'){
    title = locName(locOf(t));
    right = (t.kind === 'up' || t.kind === 'dir') ? `<div class="pill"><button class="iconbtn" aria-label="搜索" onclick="act('set','searchOn',true)">${svg('search', 22)}</button></div>` : '';
    if (t.kind !== 'space') bottom = `<button class="fab" aria-label="上传" onclick="act('addSheet')">+</button>`;
    body = vFolder(t);
  } else if (t.v === 'saved'){
    title = '最近保存';
    right = `<button class="iconbtn" aria-label="清空记录" onclick="act('clearSaved')">${svg('brush', 22)}</button>`;
    body = vSaved();
  } else if (t.v === 'transfer'){
    title = '传输';
    body = vTransfer();
  } else if (t.v === 'shares'){
    title = '我的分享';
    body = vShares();
  } else if (t.v === 'storage'){
    title = '存储容量';
    body = vStorage();
  }
  const back = t ? `<button class="iconbtn" aria-label="返回" onclick="act('back')">‹</button>` : '';
  const tabBtn = (k, label, icon, dot) => `<button aria-label="${label}" aria-current="${!t && S.tab === k ? 'page' : 'false'}" onclick="act('tab','${k}')">${svg(icon, 24)}${dot ? '<i class="dot"></i>' : ''}</button>`;
  const tabs = !t ? `<nav class="tabbar" aria-label="主导航">${tabBtn('home', '首页', 'home')}${tabBtn('files', '文件', 'folder')}${tabBtn('spaces', '空间', 'cube', unreadSpaces().length > 0)}${tabBtn('mine', '我的', 'user')}</nav>` : '';
  const content = document.querySelector('.content');
  const y = content ? content.scrollTop : 0;
  $('phone').innerHTML = `<div class="screen${!t && (S.tab === 'home' || S.tab === 'files' || S.tab === 'spaces' || S.tab === 'mine') ? ' home' : ''}${t && t.v === 'space' && !(t.dir && !t.log) && (getSpace(t.id).shared || getSpace(t.id).owner === 'me') ? ' spv' : ''}">
      <header class="topbar">${back}<div class="title">${esc(title)}</div>${right}</header>
      <main class="content">${body}</main>
      ${bottom}${tabs}${overlays()}
      ${S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''}
    </div>`;
  const c2 = document.querySelector('.content');
  if (c2) c2.scrollTop = y;
  document.querySelectorAll('.logsentinel').forEach(el => { if (!window.IntersectionObserver) return; const io = new IntersectionObserver(es => { if (es[0].isIntersecting){ io.disconnect(); setTimeout(() => act('logMore', el.dataset.k), 0); } }, {root:c2, rootMargin:'300px'}); io.observe(el); });
  $('panel').innerHTML = panel();
  if (S.focusSp){ S.focusSp = false; const q2 = $('spq'); if (q2) q2.focus(); }
  if (S.dialog && S.dialog.input != null){ const di = $('dlgIn'); if (di){ di.focus(); di.select(); } }
  if (S.focusSearch){ S.focusSearch = false; const q = $('q'); if (q) q.focus(); }
}
render();
</script>
